<!doctype html>
<html lang="de">
  <head>
    <!-- Google Consent Mode v2 + Google Tag Manager.
         Läuft nur im obersten Fenster — die eingebettete Demo (iframe) lädt
         KEIN GTM. Standard: analytics_storage = granted (GA4-Reichweitenmessung
         als Opt-out — zählt jeden, der nicht aktiv widerspricht), Werbe-Signale
         (ad_*) bleiben denied bis zur Einwilligung. Das Banner
         (src/lib/analytics.ts → setConsent) schaltet via consent 'update':
         „Akzeptieren" = alles granted, „Ablehnen" = alles denied (inkl. Analytics). -->
    <script>
      (function () {
        if (window.self !== window.top) return; // nicht im iframe tracken
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('consent', 'default', {
          ad_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
          analytics_storage: 'granted',
          functionality_storage: 'denied',
          personalization_storage: 'denied',
          security_storage: 'granted',
          wait_for_update: 500
        });
        gtag('set', 'ads_data_redaction', true);
        gtag('set', 'url_passthrough', true);
        // Frühere Wahl sofort wiederherstellen (vor dem ersten Hit).
        try {
          var savedConsent = localStorage.getItem('oco_cookie_consent');
          if (savedConsent === 'granted') {
            gtag('consent', 'update', {
              ad_storage: 'granted',
              ad_user_data: 'granted',
              ad_personalization: 'granted',
              analytics_storage: 'granted',
              functionality_storage: 'granted',
              personalization_storage: 'granted'
            });
          } else if (savedConsent === 'denied') {
            // Aktiver Widerspruch gilt dauerhaft – auch das per Default granted
            // gesetzte analytics_storage wieder abschalten.
            gtag('consent', 'update', {
              ad_storage: 'denied',
              ad_user_data: 'denied',
              ad_personalization: 'denied',
              analytics_storage: 'denied',
              functionality_storage: 'denied',
              personalization_storage: 'denied'
            });
          }
        } catch (e) { /* localStorage nicht verfügbar */ }
        (function (w, d, s, l, i) {
          w[l] = w[l] || []; w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var f = d.getElementsByTagName(s)[0], j = d.createElement(s),
            dl = l != 'dataLayer' ? '&l=' + l : '';
          j.async = true; j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
          f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-52V9SJ6J');
      })();
    </script>
    <!-- End Consent Mode v2 + GTM -->

    <!-- Meta Pixel — feuert im obersten Fenster bei jedem Seitenaufruf.
         Bewusst NICHT an die Cookie-Einwilligung gekoppelt: PageView wird auch
         bei „Ablehnen" / Wegklicken des Banners gesendet (so gewünscht). Wie GTM
         nur im Top-Fenster, nicht in der eingebetteten Demo (iframe). -->
    <script>
      (function () {
        if (window.self !== window.top) return; // nicht in der eingebetteten Demo (iframe) tracken
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1040498465323715');
        fbq('track', 'PageView');
      })();
    </script>
    <!-- Kein <noscript>-Fallback: im <head> nicht valides HTML (Vite/parse5),
         und ohne JS rendert diese SPA ohnehin nichts. -->
    <!-- End Meta Pixel Code -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneClick-Office</title>
    <meta name="description" content="OneClick-Office - Zeiterfassung, Spesen und Rechnungen" />
    <meta name="author" content="Trending Media" />

    <!-- Inter non-blocking laden: preconnect + Stylesheet, der den ersten Paint
         NICHT blockiert (media=print → onload=all). Mit display=swap zeigt der
         Browser sofort die System-Schrift und tauscht auf Inter, sobald da.
         Ersetzt den früheren render-blockenden @import in index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:title" content="OneClick-Office" />
    <meta property="og:description" content="OneClick-Office - Zeiterfassung, Spesen und Rechnungen" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/android-chrome-512x512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/android-chrome-512x512.png" />
  </head>

  <body>
    <!-- Statischer Hero: wird beim Build von scripts/prerender-hero.ts befüllt
         und liegt BEWUSST ausserhalb von #root. React (main.tsx) fasst diesen
         Container nie an → der Hero wird nach dem JS-Laden NICHT neu gemalt,
         das grösste Element (LCP) bleibt beim frühen statischen Paint (~1s). -->
    <div id="hero-static"></div>
    <script>
      // Guard: den Hero nur auf der Landing ("/") zeigen. serve --single liefert
      // für JEDE Route dasselbe index.html — in der eingebetteten Demo-iframe und
      // auf Unterseiten (z. B. /dashboard, /live) muss der Hero weg, vor dem Paint.
      (function () {
        try {
          if (window.self !== window.top || location.pathname !== "/") {
            var h = document.getElementById("hero-static");
            if (h) h.remove();
          }
        } catch (e) {}
      })();
      // CTA-Verhalten für den statischen Hero (nicht von React gesteuert):
      // Klick auf einen Hero-Link mit #-Ziel → cta_click in den dataLayer (wie
      // track()) + sanftes Scrollen zur Ziel-Section.
      (function () {
        document.addEventListener("click", function (e) {
          var a = e.target.closest && e.target.closest('#hero-static a[href^="#"]');
          if (!a) return;
          if (window.self === window.top) {
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({
              event: "cta_click",
              cta_id: a.getAttribute("data-cta-id") || "",
              cta_label: a.getAttribute("data-cta-label") || "",
            });
          }
          var target = document.getElementById(a.getAttribute("href").slice(1));
          if (target) {
            e.preventDefault();
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
